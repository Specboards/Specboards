# Self-host stack: Specboards web + Postgres. The hosted SaaS runs the same
# image on Fly.io Machines + Fly Postgres; auth (Better Auth) runs
# in-app against Postgres in both shapes. Migrations: infra/migrations/.
#
# Secrets: compose reads infra/.env automatically (see infra/.env.example).
# The postgres/postgres default below is for local development and trials
# only. For any host other machines can reach, set a strong
# POSTGRES_PASSWORD in infra/.env BEFORE the first `up`: Postgres bakes the
# password into the data volume on initialization, so changing it later
# means `ALTER USER` in psql, not just editing the env file.

# Explicit project name. Without it compose derives one from this file's parent
# directory, which is "infra" — generic enough to collide with unrelated
# projects, and identical for every clone of this repo on a machine, so two
# checkouts silently shared one `infra_specboard_db` volume and each thought it
# owned the database. Naming it here makes a stack belong to Specboards rather
# than to whatever directory it was launched from.
name: specboards

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: specboard
    ports:
      # Loopback only: host-side tools (psql, pnpm db:migrate) can connect,
      # other machines cannot. Remove the mapping if you don't need host
      # access; the web service reaches db over the compose network either
      # way. Do not publish 5432 on all interfaces.
      #
      # POSTGRES_PORT moves the host side when 5432 is already taken, which on
      # a developer's machine it very often is. The container side stays 5432,
      # so DATABASE_URL inside the compose network never changes.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - specboard_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Applies infra/migrations, then exits. `web` waits for it to succeed, so the
  # documented `docker compose up` is the whole install rather than the first
  # half of it.
  #
  # This existed on Fly (`release_command = "node migrate.mjs"` in fly.toml) and
  # nowhere here, so every environment we operate migrated itself and the one we
  # hand to other people did not: the stack came up against an empty database,
  # served its sign-up page at HTTP 200, and 500'd on the first write with
  # `relation "outbox_events" does not exist`.
  #
  # Same image as `web`, so there is nothing extra to build. The runner is
  # idempotent and takes a session advisory lock, so a re-run, a restart, or two
  # `up`s racing are all safe.
  migrate:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    command: ["node", "migrate.mjs"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/specboard
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/specboard
      # Keys session signing, the install-cookie HMAC, and AES-256-GCM
      # encryption of the GitHub App private key and webhook secret at rest
      # (apps/web/src/lib/crypto.ts). No default on purpose: `:?` makes compose
      # refuse to start without it, which is a clearer failure than the app
      # coming up and erroring the first time someone signs in or connects
      # GitHub. Minimum 32 characters, enforced in crypto.ts.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in infra/.env (openssl rand -hex 32)}
      # Public origin used for OAuth callbacks, webhook URLs, and discovery
      # metadata. The localhost default suits a local trial; when serving
      # beyond this machine, set APP_URL in infra/.env to the real HTTPS
      # origin. Without it the app falls back to request headers, which a
      # misconfigured proxy can spoof.
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Single-workspace self-host: auth/SSO are commercial add-ons.
      SPECBOARDS_SELF_HOST: "true"
      # Set to "true" to reject sign-ups from consumer email providers
      # (gmail.com, outlook.com, ...). Off by default for self-host.
      SPECBOARDS_BLOCK_PUBLIC_EMAIL_DOMAINS: "false"
      # Optional outbound email (verification / password reset) via Postmark.
      # Unset = emails are skipped with a logged warning.
      # POSTMARK_SERVER_TOKEN: ""
      # EMAIL_FROM: "Specboards <no-reply@example.com>"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      # Do not serve until the schema exists. Without this the app starts
      # against an empty database and looks healthy until the first write.
      migrate:
        condition: service_completed_successfully

volumes:
  specboard_db:
    # Pinned, so the volume's real name never again depends on the project
    # name. Compose otherwise prefixes it (`<project>_specboard_db`), which
    # means renaming the project silently points the stack at a different,
    # empty database while the old one sits on disk untouched: the app comes
    # up healthy with everyone's data apparently gone. Setting the project's
    # `name:` above would have done exactly that to existing self-hosters.
    #
    # Upgrading from a stack that predates this: your data is in
    # `infra_specboard_db`. ./setup.sh detects it and offers to adopt it
    # rather than starting empty.
    name: specboard_db

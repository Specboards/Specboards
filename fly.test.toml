# Test/staging — https://test.specboards.ai (Fly app "specboard-test", org "specboard").
# New code deploys here before production. Deploy from the repo root:
#   fly deploy -c fly.test.toml
app = "specboard-test"
primary_region = "sjc"

[build]
  dockerfile = "infra/web.Dockerfile"

[deploy]
  # Apply pending schema migrations on the new image before it takes traffic.
  # Fly runs this in a one-off machine and aborts the release if it exits
  # non-zero, so a failed migration leaves the previous version serving rather
  # than promoting code whose schema never landed. Migrations were applied by
  # hand before this existed, which left a window where new code was live and
  # the column it needed was not. The runner is idempotent (drizzle records what
  # it has applied) and takes a session advisory lock, so a retried deploy is
  # safe. It needs a role with DDL rights: DATABASE_URL is used by default, or
  # set MIGRATE_DATABASE_URL if the app's own connection is ever narrowed.
  release_command = "node migrate.mjs"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Scale to zero when idle; cold start on first request is fine for test.
  min_machines_running = 0

  # Mirror production's health check so staging surfaces probe/route issues first.
  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  # Match production's 512 MB so staging surfaces the same memory ceiling.
  memory = "512mb"

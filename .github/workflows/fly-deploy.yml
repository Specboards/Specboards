# Cloud deploy pipeline:
#   - every push to main deploys the app to test (https://test.specboards.ai)
#   - production (https://app.specboards.ai) deploys via manual dispatch, once a
#     build has been verified on test
# The marketing site (https://www.specboards.ai) lives in the separate Website
# repo and deploys from there.
name: Fly Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        type: choice
        options: [test, production]
        required: true

jobs:
  deploy-test:
    # Only deploy from the canonical repo. Forks / self-hoster clones never push
    # to Studio Palouse's Fly apps even if they enable Actions.
    if: github.repository == 'Specboards/Specboards' && (github.event_name == 'push' || github.event.inputs.environment == 'test')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: fly-deploy-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master, 2026-04-08
      # GIT_SHA is baked into the client bundle at build time so /legal's
      # "Source code" link resolves to the exact commit running (AGPL s13).
      # It has to be passed on every deploy path or the link silently degrades
      # to the repo root, which is why it is here and not left to a human.
      - run: flyctl deploy -c fly.test.toml --remote-only --build-arg GIT_SHA="${GITHUB_SHA::7}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_TEST }}

  deploy-production:
    if: github.repository == 'Specboards/Specboards' && github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: fly-deploy-production
    steps:
      # workflow_dispatch runs against whichever branch was selected, and the
      # deploy below calls flyctl directly rather than going through
      # scripts/deploy.sh, which is where the same refusal lives for a human
      # running it locally. Without this the two paths to production disagree,
      # and the one with no guard is the one that runs unattended.
      #
      # It also protects the AGPL s13 offer: GIT_SHA is baked into the bundle so
      # /legal links to the exact commit running, and a sha that is not on main
      # names source a reader may not be able to fetch.
      #
      # Failing rather than skipping is deliberate. Adding the ref to the job's
      # `if:` would have been shorter, but a skipped job reports success and
      # says nothing, so an operator who dispatched production from a branch
      # would see a green run and reasonably believe it had deployed.
      - name: Refuse production from anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Refusing to deploy production from ${GITHUB_REF}. Merge to main first, then dispatch from main (see CLAUDE.md)."
          exit 1
      # fetch-depth 0 so the tags are present: the release guard below asks
      # whether one points at this commit, and a shallow checkout has none, so
      # it would fail every release rather than only the unreleased ones.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The same refusal scripts/deploy.sh applies for a human, for the same
      # reason the main-only check above is duplicated: the unattended path is
      # the one that must not be the weaker of the two. A version that is not
      # bumped in lockstep, described in the changelog and tagged here is not a
      # release, and production has shipped eight of those already.
      - name: Refuse production of an unreleased version
        run: ./scripts/release-guard.sh
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master, 2026-04-08
      - run: flyctl deploy --remote-only --build-arg GIT_SHA="${GITHUB_SHA::7}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PROD }}

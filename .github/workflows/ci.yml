# Continuous integration: typecheck, unit tests, and the Playwright E2E suite on
# every PR (and on main). This is the green-before-merge gate the project relied
# on running by hand until now.
name: CI

on:
  # Every pull request, not only those aimed at main. A stacked branch (one PR
  # built on another that has not merged yet) targets its parent, and with a
  # main-only filter those PRs got no CI at all: the gate silently did not
  # apply to exactly the changes most likely to need it.
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: specboard_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Consumed by the migrate step and the E2E run (both the test runner and
      # the app server it spawns). Points at the Postgres service above.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/specboard_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Turborepo's cache, which CI otherwise starts empty on every run.
      # `turbo.json` already declares proper `outputs`, so the tasks were always
      # cacheable; nothing was carrying the cache between runs to find out.
      #
      # Keyed by commit so each run writes its own entry, and restored from the
      # most recent one for this OS. A pull request falls back to whatever main
      # last wrote, which is the common case here.
      #
      # See the prune step at the end of this job for why this stays small.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Fail the build on a high/critical advisory in production dependencies.
      # Accepted exceptions are recorded by GHSA id in package.json
      # (pnpm.auditConfig.ignoreGhsas) and documented, with a review-by date, in
      # docs/security-audit-exceptions.md. A scheduled full audit
      # (security-audit.yml) surfaces lower-severity drift out of band.
      - run: pnpm run audit

      # Build packages + web once; typecheck and E2E both need the output.
      - run: pnpm -w build
      - run: pnpm -w typecheck
      # Lint gate: fails the build on any error, across every package. The web
      # app uses its own flat config (Next + the eslint-plugin-jsx-a11y ruleset
      # that guards the WCAG 2.2 AA work); everything else shares the root
      # eslint.config.mjs. This used to be scoped to the web app because the
      # other packages had `lint` scripts with no eslint installed to run.
      - run: pnpm -w lint

      # Dead-code gate, the other half of the lint one above. `no-unused-vars`
      # sees inside a file; knip sees across the workspace, so an export nothing
      # imports, a file nothing reaches, and a dependency nothing needs all fail
      # here. Runs after build because knip resolves the workspace's own
      # packages. Config and the reasoning behind each suppression: knip.ts.
      - run: pnpm -w knip

      - run: pnpm -w test

      # E2E: apply migrations, install the browser, run the onboarding suite
      # (SPECBOARDS_E2E seams let it run hermetically with a faked GitHub).
      - run: pnpm --filter @specboards/db migrate

      # Two-tenant RLS isolation suite: connects as a non-owner role and
      # proves tenant data cannot cross the workspace boundary (fails closed).
      - run: pnpm --filter @specboards/web test:int

      # The browser binary, which was downloaded fresh every run. Keyed on the
      # lockfile rather than on the Playwright version alone: over-invalidating
      # costs one download, and a stale browser against a bumped Playwright is
      # the kind of failure nobody would look for here.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # On a hit the binary is already there and only the OS packages it links
      # against are checked, which is why the two are split rather than always
      # running `install --with-deps`.
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @specboards/web exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @specboards/web exec playwright install-deps chromium

      - run: pnpm --filter @specboards/web test:e2e

      # Keep the Turborepo cache small enough to be worth having.
      #
      # A cached `@specboards/web#build` is 263 MB, because the entry is the
      # whole of `.next`. Saved unpruned, one run restores the last one and adds
      # its own, so the cache grows by a quarter of a gigabyte per run and
      # crosses GitHub's 10 GB per-repository budget in about five weeks of
      # merges. Nothing warns when that happens: the eviction is silent and
      # least-recently-used, so the first thing lost is whichever cache was not
      # touched this run, and CI gets slower for reasons no one can see.
      #
      # Dropping the oversized entries leaves the cheap ones, which are the
      # frequent hits anyway: every task in `packages/*` replays for any pull
      # request that only touches `apps/web`, which is most of them. What is
      # given up is the app's own build being replayed on a run that did not
      # touch it, and those runs rebuild in about a minute.
      - name: Prune oversized entries from the Turborepo cache
        if: always()
        run: |
          # `always()` above means this can run after a step that failed before
          # anything was built, so the directory is not guaranteed to be here.
          [ -d .turbo/cache ] || exit 0
          find .turbo/cache -name '*.tar.zst' -size +50M -print0 |
            while IFS= read -r -d "" tar; do
              rm -f "$tar" "${tar%.tar.zst}-meta.json" "${tar%.tar.zst}-manifest.json"
            done
          du -sh .turbo/cache || true

# Prove the documented self-host install still produces a working instance.
#
# Nothing else asks this question. CI builds, tests and lints the code, but it
# never runs `docker compose up`, so the whole self-host path could break and
# every check would stay green: a change to the Dockerfile, an env var the app
# newly requires, a migration needing a privilege the compose Postgres does not
# grant. The 2026-08-31 clean-machine run found the stack coming up against an
# empty database and 500ing on the first write, and it had been that way for as
# long as compose had existed.
#
# Verifying self-host by hand once before v1.0.0 buys a launch and nothing
# after it. The Homebrew tap already proves its own install on every bump; this
# is the equivalent for a far more important promise.
#
# Deliberately a smoke test. The E2E suite covers behaviour; this only answers
# "does the documented install still produce a working instance", which is
# exactly what nothing currently asks.
name: Self-host smoke

on:
  schedule:
    # Still daily, even though every PR now runs this. The cron catches drift
    # that no commit of ours causes: a base image moving under the Dockerfile,
    # a published image re-tagged, an upstream package pulled at build time. No
    # PR trigger can see any of that, because nothing in the repo changed.
    - cron: "17 6 * * *"
  # Deliberately no `paths:` filter on either of these.
  #
  # There was one, listing infra/**, setup.sh and migrate.ts, and it rested on
  # the assumption that self-host breakage originates in infrastructure. That
  # assumption is false, and we have the counterexample: #381 changed the `/`
  # redirect in apps/web/src/app/page.tsx so a fresh instance lands on account
  # creation rather than sign-in, which is correct, and it broke this job's
  # assertion. None of the filtered paths were touched, so nothing ran, and the
  # job sat red on a schedule nobody was watching from 2026-09-02 until a
  # migration happened to land under infra/ four days later.
  #
  # The self-host contract is defined partly by ordinary application code -
  # what `/` serves, which env vars boot requires, what the first write touches
  # - so a filter that watches only infrastructure cannot see the changes most
  # likely to break it. Enumerating the app files that matter would be guessing
  # at the same thing again.
  #
  # The cost of not filtering is 31 seconds, run in parallel with a test job
  # that takes 4 to 7 minutes, so it adds nothing to how long a PR takes.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Exactly what the README tells a person to run. Not a bespoke sequence
      # of compose commands: the point is to test the documented path, so if
      # setup.sh stops working this has to fail with it.
      #
      # Pulls the published image when there is one and falls back to building
      # from the tree, which is also what an operator gets, so this covers
      # whichever path is real on the day.
      - name: Install the way the README says to
        run: ./setup.sh

      # 1. The process serves. A freshly installed instance has no users, so `/`
      # redirects to /sign-up in first-run mode, not to /sign-in. See the
      # comment in app/page.tsx: a "Welcome back" password form is a dead end
      # for someone who has just run setup.sh and has no account yet.
      #
      # This asserted "Sign in", and so failed every run from 2026-09-02 on.
      # Asserting on the first-run heading checks the thing that actually
      # matters: a self-hoster following the README lands on the step that
      # makes them the administrator.
      - name: Serves the first-run admin sign-up page
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' -L http://localhost:3000/)"
          [ "$code" = "200" ] || { echo "GET / returned $code"; exit 1; }
          curl -fsS -L http://localhost:3000/ | grep -q "Create the admin account" \
            || { echo "GET / is not the first-run admin sign-up page."; exit 1; }

      # 2. Migrations actually ran. The failure this exists for was an app that
      # started healthy against an empty database, so "it responds" is not
      # enough: ask the database what it has.
      - name: Migrations applied
        run: |
          tables="$(docker exec specboards-db-1 psql -U postgres -d specboard -tAc \
            "select count(*) from information_schema.tables where table_schema='public';")"
          echo "public tables: $tables"
          # Exact count would break on every migration that adds one. The
          # distinction being drawn is "schema" vs "nothing".
          [ "$tables" -gt 40 ] || { echo "Only $tables tables; migrations did not run."; exit 1; }
          docker logs specboards-migrate-1 2>&1 | grep -qE "applied [0-9]+ migration|already up to date" \
            || { echo "The migrate service did not report success."; exit 1; }

      # 3. The database is writable through the app, not just present. Sign-up
      # is the first thing any real operator does and it touches several tables.
      # A self-host with no mail transport does not require verification, so a
      # successful sign-up returns a session token; its absence means the
      # verification gate is wrongly on and the operator would be locked out.
      - name: A first account can be created and is signed in
        run: |
          body="$(curl -fsS -X POST http://localhost:3000/api/auth/sign-up/email \
            -H 'Content-Type: application/json' \
            -d '{"name":"Smoke Test","email":"smoke@onprem.test","password":"SmokeTest!2026x"}')"
          echo "$body" | grep -q '"token"' \
            || { echo "Sign-up returned no session token: $body"; exit 1; }
          users="$(docker exec specboards-db-1 psql -U postgres -d specboard -tAc \
            "select count(*) from users where email='smoke@onprem.test';")"
          [ "$users" = "1" ] || { echo "Expected 1 user row, found $users."; exit 1; }

      # Whatever failed above, the logs are the first thing anyone will want,
      # and a dead container's logs are gone once the runner is recycled.
      - name: Logs on failure
        if: failure()
        run: |
          echo "=== web ==="; docker logs specboards-web-1 2>&1 | tail -60 || true
          echo "=== migrate ==="; docker logs specboards-migrate-1 2>&1 | tail -40 || true
          echo "=== db ==="; docker logs specboards-db-1 2>&1 | tail -30 || true
          echo "=== compose ==="; docker compose -f infra/docker-compose.yml ps -a || true

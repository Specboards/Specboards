# Reusable Specboards-sync workflow. A customer enables the PR -> work-item-status
# loop by calling this from their repo with ~5 lines (see the snippet below),
# instead of copying a workflow plus scripts/specboards/*. It consumes the
# published `@specboards/cli` (no monorepo build), so the only prerequisites are
# the two secrets and that the calling repo is the SAME repo whose specs were
# imported into the target Specboards workspace (spec ids resolve from that
# repo's specs/**/spec.md frontmatter).
#
# Caller snippet (.github/workflows/specboards-sync.yml in the customer's repo):
#
#   name: Specboards Sync
#   on:
#     pull_request:
#       types: [opened, reopened, synchronize, closed]
#   jobs:
#     sync:
#       uses: Specboards/Specboards/.github/workflows/specboards-sync-reusable.yml@main
#       secrets:
#         SPECBOARDS_URL: ${{ secrets.SPECBOARDS_URL }}
#         SPECBOARDS_TOKEN: ${{ secrets.SPECBOARDS_TOKEN }}
name: Specboards Sync (reusable)

on:
  workflow_call:
    inputs:
      cli_version:
        description: "Exact version of @specboards/cli to run. A dist-tag works but is not recommended."
        type: string
        # An exact version, not `latest`. This step runs in the customer's CI
        # and the next one hands the CLI a token that can move their work
        # items, so "whatever was published most recently" is a decision nobody
        # made. Pinned, a compromise has to reach a specific release that can be
        # audited and yanked, rather than any future publish being picked up
        # automatically by every caller at once.
        #
        # MUST be bumped when @specboards/cli is released, or callers who do not
        # pass cli_version stay on this version. That is the safe direction to
        # fail, but it is silent, so it belongs in the release checklist.
        default: "0.26.8"
    secrets:
      SPECBOARDS_URL:
        required: true
      SPECBOARDS_TOKEN:
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history so the PR base..head diff resolves touched specs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Asked before the install rather than inside it, so a repo that has not
      # set the secrets still skips the whole job rather than paying for (and
      # failing on) an install it will not use. This used to be the first few
      # lines of the sync step, which is why it moves here rather than appears.
      - name: Check the Specboards secrets are set
        id: configured
        env:
          SPECBOARDS_URL: ${{ secrets.SPECBOARDS_URL }}
          SPECBOARDS_TOKEN: ${{ secrets.SPECBOARDS_TOKEN }}
        run: |
          if [ -z "${SPECBOARDS_URL:-}" ] || [ -z "${SPECBOARDS_TOKEN:-}" ]; then
            echo "Specboards secrets not set; skipping sync."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Its own step, with no secrets in the environment, and with install
      # scripts off. An install is the one part of this job that runs code
      # nobody in this repository wrote, and it used to run inside the step
      # already holding SPECBOARDS_TOKEN, so a postinstall in a bad release of
      # the CLI or of anything it depends on could read the token straight out
      # of the environment.
      #
      # `--ignore-scripts` costs nothing here: @specboards/cli has no runtime
      # dependencies at all and no install scripts of its own, and npm creates
      # the `specboards` bin shim from the manifest rather than from a script.
      # If it ever gains a dependency that genuinely needs to build on install,
      # this flag is the thing that will break, and it should be argued with
      # rather than removed.
      #
      # This does not make the CLI itself trusted: the next step runs it with
      # the token in its environment, which is what the pin on `cli_version` is
      # for. Together they mean the code that sees the token is a named release
      # rather than whatever was published most recently.
      - name: Install the Specboards CLI
        if: steps.configured.outputs.ok == 'true'
        env:
          CLI_VERSION: ${{ inputs.cli_version }}
        run: npm install -g --ignore-scripts "@specboards/cli@${CLI_VERSION}"

      - name: Sync work items from the PR
        if: steps.configured.outputs.ok == 'true'
        env:
          SPECBOARDS_URL: ${{ secrets.SPECBOARDS_URL }}
          SPECBOARDS_TOKEN: ${{ secrets.SPECBOARDS_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          set -uo pipefail
          # Resolve touched spec ids: frontmatter id of changed specs/**/spec.md,
          # plus any `Spec: <id>` trailer in the PR body (code-only PRs).
          base="${BASE_SHA:-origin/main}"
          head="${HEAD_SHA:-HEAD}"
          ids=""
          if changed=$(git diff --name-only "$base" "$head" 2>/dev/null); then
            while IFS= read -r f; do
              case "$f" in
                specs/*/spec.md)
                  [ -f "$f" ] || continue
                  id=$(grep -m1 '^id:' "$f" 2>/dev/null \
                    | sed 's/^id:[[:space:]]*//; s/"//g; s/'\''//g; s/[[:space:]]*$//')
                  [ -n "$id" ] && ids="$ids$id"$'\n'
                  ;;
              esac
            done <<EOF
          $changed
          EOF
          fi
          if [ -n "${PR_BODY:-}" ]; then
            while IFS= read -r id; do
              id=$(printf '%s' "$id" | tr -d '\r' | sed 's/[[:space:]]*$//')
              [ -n "$id" ] && ids="$ids$id"$'\n'
            done < <(printf '%s\n' "$PR_BODY" | sed -n 's/^[Ss]pec:[[:space:]]*//p')
          fi
          ids=$(printf '%s' "$ids" | sed '/^$/d' | sort -u)
          if [ -z "$ids" ]; then
            echo "No spec ids resolved for this PR; nothing to sync."
            exit 0
          fi

          # Drive status from the PR. --advance walks a spec several stages behind
          # the target through the intermediate statuses. Best-effort per id.
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            if [ "${ACTION:-}" = "closed" ] && [ "${MERGED:-}" = "true" ]; then
              echo "==> $id: done"
              specboards status "$id" done --advance || echo "  (skip: no legal path to 'done')"
            else
              echo "==> $id: in_progress + link PR #${PR_NUMBER:-?}"
              specboards status "$id" in_progress --advance || echo "  (skip: no legal path to 'in_progress')"
              if [ -n "${PR_NUMBER:-}" ]; then
                specboards link "$id" --pr "$PR_NUMBER" || echo "  (skip: link failed, maybe already linked)"
              fi
            fi
          done <<EOF
          $ids
          EOF

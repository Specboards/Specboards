# Dependabot keeps two things fresh:
#
#   - github-actions: PR #156 pinned every Action to a commit SHA. Pins do not
#     drift on their own, so without this they silently rot. Dependabot opens a
#     reviewed bump PR (new SHA + version comment) when an Action releases.
#
#   - npm: the pnpm workspace. Grouped and rate-limited so routine bumps arrive
#     as a small number of PRs rather than a flood; security updates still come
#     through on their own. Backs the CI audit gate (pnpm run audit) by keeping
#     production dependencies current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR for routine minor/patch bumps; majors and security stay separate.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # eslint 10 crashes eslint-plugin-react (`contextOrFilename.getFilename is
      # not a function`), which eslint-config-next bundles; the plugin's latest
      # release only supports eslint up to 9. Lift this once it supports 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # better-auth 1.7 removes the mcp and OAuth discovery plugins the MCP
      # sign-in is built on, so it is a migration, not a bump. Patches on 1.6
      # still come through. Lift this when that migration is planned.
      - dependency-name: "better-auth"
        update-types: ["version-update:semver-minor"]
